# HBS add-on stack for Headwind MDM (community edition)
# Lives in /opt/hbs-addons/stack. Values come from ./.env (generated by install.sh).
# Everything except DoT (853) and RustDesk (21115-21119) binds to 127.0.0.1 and is published by Caddy.

name: hbs

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ---------- Edge: TLS + reverse proxy + 2FA gate ----------
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    network_mode: host
    env_file: [.env, caddy-extra.env]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ./data/apk:/srv/apk:ro
    profiles: ["edge"]
    <<: *logging

  # ---------- Google sign-in gate (allowed accounts: oauth2-proxy/allowed-emails.txt) ----------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    network_mode: host
    env_file: oauth2-proxy.env
    command:
      - --provider=google
      - --http-address=127.0.0.1:4180
      - --redirect-url=https://auth.${DOMAIN}/oauth2/callback
      - --cookie-domain=.${DOMAIN}
      - --whitelist-domain=.${DOMAIN}
      - --cookie-secure=true
      - --cookie-expire=12h
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --approval-prompt=auto
      - --upstream=static://202
      - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails.txt
    volumes:
      - ./oauth2-proxy/allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
    <<: *logging

  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ./authelia:/config
    <<: *logging

  # ---------- Location ----------
  traccar:
    image: traccar/traccar:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"   # web UI / API
      - "127.0.0.1:5055:5055"   # OsmAnd protocol (Traccar Client), published via https://track.<domain>
    volumes:
      - ./data/traccar/data:/opt/traccar/data
      - ./data/traccar/logs:/opt/traccar/logs
    <<: *logging

  # ---------- Remote control ----------
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RUSTDESK_HOST}:21117
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/rustdesk:/root
    depends_on: [hbbr]
    <<: *logging

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/rustdesk:/root
    <<: *logging

  # ---------- Files, photos, contacts ----------
  nc-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - ./data/nc-db:/var/lib/postgresql/data
    <<: *logging

  nc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging

  nextcloud:
    image: nextcloud:stable
    restart: unless-stopped
    depends_on: [nc-db, nc-redis]
    ports:
      - "127.0.0.1:8083:80"
    environment:
      POSTGRES_HOST: nc-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
      REDIS_HOST: nc-redis
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_HOST}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${NC_HOST}
      TRUSTED_PROXIES: 172.16.0.0/12 127.0.0.1
      PHP_UPLOAD_LIMIT: 2G
    volumes:
      - ./data/nextcloud:/var/www/html
    <<: *logging

  nc-cron:
    image: nextcloud:stable
    restart: unless-stopped
    depends_on: [nextcloud]
    entrypoint: /cron.sh
    volumes:
      - ./data/nextcloud:/var/www/html
    <<: *logging

  # ---------- DNS filtering (DNS-over-TLS for Android "Private DNS") ----------
  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:3000"   # first-run setup / admin UI (moved to 80 inside after setup)
      - "127.0.0.1:8085:80"     # admin UI + DoH after setup
      - "853:853/tcp"           # DNS-over-TLS (public)
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
      - ./data/caddy:/caddy-data:ro   # reuse Caddy's Let's Encrypt cert for dns.<domain>
    <<: *logging

  # ---------- Glue: Headwind <-> add-ons, OTA provisioning ----------
  bridge:
    build: ../bridge
    image: hbs-bridge:local
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./data/bridge:/data
      - ./data/apk:/data/apk
      - ./data/rustdesk:/rustdesk:ro
      - ./secrets:/secrets:ro
    <<: *logging
